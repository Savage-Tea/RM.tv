server {
    listen 80;
    server_name rmtv.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rmtv.local;

    ssl_certificate     /etc/ssl/certs/rmtv.crt;
    ssl_certificate_key /etc/ssl/private/rmtv.key;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;
    server_tokens off;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api_limit burst=20 nodelay;
    }

    # Static frontend
    location / {
        root /var/www/rmtv;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
}
